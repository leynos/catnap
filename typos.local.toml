schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Inspect inline code for ordinary misspellings instead of masking every span.
remove = ['`[^`\n]+`']
ignore = [
  '\bCARGO_TERM_COLOR\b',
  '\bmold\b',
  '"seconde"',
  # GitHub's action identifier is fixed, including its spelling.
  '`upload-artifact`',
]

[files]
exclude = []
