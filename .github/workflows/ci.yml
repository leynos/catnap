---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin
      YAMLLINT_VERSION: '1.38.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@45bef492e355d6b586bce00d2249a4038a2a7363
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@3822201c597078a5ed1939bdf067fe06a3d78a9d
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@0d13344ea8b610217b17922d841a583b4f3a6427
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@e105c8fb1d7b13074b851babdaef4185243c6a07
        with:
          python-version: '3.14'
      - name: Cache yamllint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .uv-cache
            .uv-tools
            .uv-bin
          key: yamllint-${{ runner.os }}-${{ runner.arch }}-${{ env.YAMLLINT_VERSION }}
      - name: Install yamllint
        run: |
          uv tool install "yamllint==${YAMLLINT_VERSION}"
          echo "${UV_TOOL_BIN_DIR}" >> "$GITHUB_PATH"
      - name: Cache actionlint
        id: cache_actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-1.7.12
      - name: Download actionlint
        id: get_actionlint
        if: steps.cache_actionlint.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          readonly ACTIONLINT_VERSION='1.7.12'
          readonly ACTIONLINT_SHA256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          readonly ACTIONLINT_INSTALLER_COMMIT='914e7df21a07ef503a81201c76d2b11c789d3fca'
          readonly ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          readonly ACTIONLINT_RAW_BASE='https://raw.githubusercontent.com/rhysd/actionlint'
          readonly ACTIONLINT_SCRIPT='scripts/download-actionlint.bash'
          readonly ACTIONLINT_INSTALLER_URL="${ACTIONLINT_RAW_BASE}/${ACTIONLINT_INSTALLER_COMMIT}/${ACTIONLINT_SCRIPT}"
          readonly ACTIONLINT_RELEASE_ROOT='https://github.com/rhysd/actionlint/releases/download'
          readonly ACTIONLINT_RELEASE_BASE="${ACTIONLINT_RELEASE_ROOT}/v${ACTIONLINT_VERSION}"
          readonly ACTIONLINT_RELEASE_URL="${ACTIONLINT_RELEASE_BASE}/${ACTIONLINT_ARCHIVE}"
          ACTIONLINT_INSTALLER_PATH="$(mktemp)"
          ACTIONLINT_ARCHIVE_PATH="$(mktemp)"
          trap 'rm -f "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_ARCHIVE_PATH}"' EXIT
          # Feed the verified archive to the reviewed installer without a second download.
          curl() {
            if [[ "${*: -1}" == "${ACTIONLINT_RELEASE_URL}" ]]; then
              cat "${ACTIONLINT_ARCHIVE_PATH}"
            else
              command curl "$@"
            fi
          }
          export -f curl
          command curl --fail --location --show-error --output "${ACTIONLINT_INSTALLER_PATH}" \
            "${ACTIONLINT_INSTALLER_URL}"
          command curl --fail --location --show-error --output "${ACTIONLINT_ARCHIVE_PATH}" \
            "${ACTIONLINT_RELEASE_URL}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${ACTIONLINT_ARCHIVE_PATH}" | sha256sum --check --
          bash "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_VERSION}"
        shell: bash
      - name: Spelling
        run: make spelling
      - name: Install test runner
        run: cargo binstall --no-confirm cargo-nextest
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          set -euo pipefail
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          # --cranelift provisions rustc-codegen-cranelift on Whitaker's pinned
          # toolchain; this project builds with the Cranelift debug backend.

          whitaker-installer --cranelift
          echo "Whitaker binary: $(command -v whitaker || true)"
      - name: Lint
        run: /usr/bin/make ACTIONLINT="$GITHUB_WORKSPACE/actionlint" lint
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so an upload here is silently inert for
        # exactly the changes that most need reviewing, and CodeScene accepts
        # an upload only for a branch it analyses, which a pull request head
        # is not. `coverage-main.yml` owns both persistent outputs, and the
        # baseline paths are the action's defaults on both sides, so this
        # ratchet reads the baseline that workflow writes.
        uses: leynos/shared-actions/.github/actions/generate-coverage@45bef492e355d6b586bce00d2249a4038a2a7363
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
