---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      NETSUKE_TOOLCHAIN: nightly-2026-08-23
      NETSUKE_VERSION: 0.1.0-beta4
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@b804b69fa7f978cf9091b9d9bd5481d8ce58c2ea
        with:
          install-mold: 'true'
          expect-cache: any
          # One sccache lane with coverage-main.yml's publisher: only a push to main saves,
          # so pull requests warm from the lane main's publisher writes.
          sccache-cache-discriminator: coverage
          install-clang-lld: 'true'
      - name: Install rust-analyzer
        # The shared setup action installs build components but not this one.
        run: rustup component add rust-analyzer
      - name: Cache Netsuke
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/netsuke
          key: netsuke-${{ runner.os }}-${{ runner.arch }}-${{ env.NETSUKE_VERSION }}-${{ env.NETSUKE_TOOLCHAIN }}
      - name: Install Netsuke from crates.io
        run: |
          set -euo pipefail
          if netsuke --version 2>/dev/null | grep --fixed-strings --quiet "${NETSUKE_VERSION}"; then
            exit 0
          fi
          rustup toolchain install "${NETSUKE_TOOLCHAIN}" --profile minimal
          cargo "+${NETSUKE_TOOLCHAIN}" install --locked \
            netsuke-build --version "=${NETSUKE_VERSION}"
      - name: Install Ninja
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends ninja-build
      - name: Install Cranelift backend
        run: netsuke build install-cranelift
      - name: Install mdtablefix
        # `netsuke build check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: "0.6.1"

      - name: Format
        run: netsuke build check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@4d036b826b8b2df8671d140de0d86cef0f5c2202
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@b3c9b5fc56ebc90760c43b1ac9552c0d1705d3ca
        with:
          python-version: '3.14'
      - name: Check the CV-005 contracts
        run: netsuke build test-workflow-contracts
      - name: Spelling
        run: netsuke build spelling
      - name: Install the stable toolchain
        # tests/stable_cargo_config.rs runs stable Cargo, the toolchain the
        # release builds with, against .cargo/config.toml.
        run: rustup toolchain install stable --profile minimal
      - name: Install test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-nextest
      - name: Test public error UI contracts
        run: netsuke build test-ui
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@ff1dd759dfffc0db3459e30e833f52437ee62b57
      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@26c918632c5413039a84358fafe012a4399a9ec7
      - name: Lint
        run: netsuke build lint
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        # Coverage here is for the local ratchet and nothing else. The report
        # is neither archived (`publish-artefact: 'false'`) nor sent to
        # CodeScene: a pull request from a fork cannot read
        # `secrets.CS_ACCESS_TOKEN`, so an upload here is silently inert for
        # exactly the changes that most need reviewing, and CodeScene accepts
        # an upload only for a branch it analyses, which a pull request head
        # is not. `coverage-main.yml` owns both persistent outputs, and the
        # baseline paths are the action's defaults on both sides, so this
        # ratchet reads the baseline that workflow writes.
        uses: leynos/shared-actions/.github/actions/generate-coverage@d4d248bbbecdcf7b4f5bc79ffd4d6caee370bd79
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
