name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own local
# ratchet check, in `ci.yml`; they neither publish a report nor contact
# CodeScene.
#
# CodeScene accepts `cs-coverage upload` only for a branch it analyses, which a
# pull request head is not, and a pull request from a fork cannot read
# `secrets.CS_ACCESS_TOKEN` at all. Caches and baselines written on `main` are
# readable by every pull-request run, so the baseline written here is the one
# those ratchet checks compare against.

'on':
  push:
    branches: [main]
  # A dispatch reads the baseline without advancing it: the shared action
  # publishes a new baseline only on a push to `refs/heads/main`, so a manual
  # run can measure this lane without moving the figure it is measuring.
  workflow_dispatch:

# A run in progress is never cancelled. A cancelled publisher abandons both its
# upload and its ratchet baseline write. The group is keyed on the ref alone:
# runs never overlap, and a newer trigger replaces any run still pending, so
# for triggered runs (push and dispatch) the survivor is the newest main and
# uploads land in commit order. A manual re-run of an older main run is an
# operator action: it republishes that commit's coverage and baseline until
# the next push. Keying on the event too would let an earlier dispatch finish
# after a newer push and upload older coverage last. `tests/coverage_workflows.rs` pins this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        # The pull-request lane's revision, so both measurements share one
        # toolchain setup.
        uses: leynos/shared-actions/.github/actions/setup-rust@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
      - name: Install coverage linkers
        # The same packages as the pull-request lane: `.cargo/config.toml`
        # names clang and mold, and the coverage step below selects lld.
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Test and Measure Coverage
        # The same action, linker environment, format, output path and default
        # baseline files as the pull-request lane, so the figure written here
        # is the figure a pull request is measured against. The action decides
        # by the event whether it writes the baseline or compares with it.
        uses: leynos/shared-actions/.github/actions/generate-coverage@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Check for the CodeScene token
        id: codescene-token
        # The expression is evaluated before the shell runs, so this step reports
        # whether the secret is set while holding nothing in its `env`. No step
        # here binds the token in `env`: the upload action is composite and would
        # hand a step `env` to its nested `upload-artifact` and cache steps, so
        # the upload passes the secret as its `access-token` input instead.
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # An unset secret leaves the upload out rather than failing the lane.
        # The ref conjunct is what keeps the dispatch trigger above from
        # uploading a branch CodeScene does not analyse: the push trigger is
        # restricted to `main`, but a dispatch may name any branch.
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dc935ad8202c30495deaaaca7be4f876659e37ad
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
